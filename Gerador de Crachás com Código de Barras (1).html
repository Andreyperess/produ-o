const LOGO_RATIO = 2.0870;
const STORE = "crachas:v1";
const ASCII = /^[\x20-\x7E]+$/;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = (s) => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();

/* ---------- Barcode (tela) ---------- */
function Bar({ value, label }) {
  const ref = useRef(null);
  const [err, setErr] = useState(false);
  useEffect(() => {
    try {
      JsBarcode(ref.current, value, { format: "CODE128", width: 2, height: 50, displayValue: true, fontSize: 14, margin: 6, background: "#fff" });
      setErr(false);
    } catch (e) { setErr(true); }
  }, [value]);
  return html`<div class="text-center">
    <div class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">${label}</div>
    ${err ? html`<div class="text-xs text-red-600 py-4">Caracteres inválidos para Code 128</div>` : null}
    <svg ref=${ref} class=${"max-w-full mx-auto " + (err ? "hidden" : "")}></svg>
  </div>`;
}

/* ---------- PDF (barcodes nítidos como imagem PNG de alta resolução) ---------- */
function barImg(value) {
  const c = document.createElement("canvas");
  JsBarcode(c, value, { format: "CODE128", width: 4, height: 100, displayValue: false, marginLeft: 30, marginRight: 30, marginTop: 0, marginBottom: 0, background: "#ffffff" });
  return { url: c.toDataURL("image/png"), ratio: c.width / c.height };
}
function drawCard(pdf, p, x, y, W, H) {
  const BLUE = [0, 111, 142], CYAN = [0, 152, 184];
  pdf.setDrawColor(...BLUE); pdf.setLineWidth(0.4); pdf.rect(x, y, W, H);
  pdf.setFillColor(...BLUE); pdf.rect(x, y, W, 13, "F");
  pdf.setFillColor(...CYAN); pdf.rect(x, y + H - 3, W, 3, "F");
  pdf.setFillColor(255, 255, 255); pdf.roundedRect(x + 2, y + 1.8, 9.4 * LOGO_RATIO + 1.6, 9.4, 1, 1, "F");
  pdf.addImage(LOGO, "JPEG", x + 2.8, y + 2.6, 7.8 * LOGO_RATIO, 7.8);
  pdf.setTextColor(255); pdf.setFont("helvetica", "bold"); pdf.setFontSize(8);
  pdf.text("CARTÃO DE ACESSO", x + W - 3, y + 7.6, { align: "right" });
  // nome: fonte fixa, no máximo 2 linhas
  pdf.setFont("helvetica", "bold"); pdf.setFontSize(10); pdf.setTextColor(0, 80, 102);
  let lines = pdf.splitTextToSize(p.nome, W - 8);
  if (lines.length > 2) {
    let l2 = lines[1];
    while (l2.length && pdf.getTextWidth(l2 + "…") > W - 8) l2 = l2.slice(0, -1);
    lines = [lines[0], l2.trimEnd() + "…"];
  }
  if (lines.length === 1) pdf.text(lines[0], x + W / 2, y + 20, { align: "center" });
  else { pdf.text(lines[0], x + W / 2, y + 18.2, { align: "center" }); pdf.text(lines[1], x + W / 2, y + 22.4, { align: "center" }); }
  pdf.setTextColor(0);
  [["MATRÍCULA", p.matricula, 26], ["SENHA", p.senha, 43]].forEach(([lab, val, dy]) => {
    pdf.setFont("helvetica", "normal"); pdf.setFontSize(6.5); pdf.setTextColor(0, 111, 142);
    pdf.text(lab, x + W / 2, y + dy, { align: "center" }); pdf.setTextColor(0);
    const b = barImg(val); let h = 8, w = h * b.ratio; if (w > W - 8) { w = W - 8; h = w / b.ratio; }
    pdf.addImage(b.url, "PNG", x + (W - w) / 2, y + dy + 1 + (8 - h) / 2, w, h);
    pdf.setFontSize(8.5); pdf.text(val, x + W / 2, y + dy + 13, { align: "center" });
  });
}
function makePdf(list, name) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4" });
  const W = 90, H = 62, gx = 10, gy = 5, mx = 10, my = 10, perPage = 8;
  list.forEach((p, i) => {
    if (i > 0 && i % perPage === 0) pdf.addPage();
    const k = i % perPage, col = k % 2, row = Math.floor(k / 2);
    drawCard(pdf, p, mx + col * (W + gx), my + row * (H + gy), W, H);
  });
  pdf.save(name);
}

/* ---------- App ---------- */
function App() {
  const [tab, setTab] = useState("entrada");
  const [mode, setMode] = useState("manual");
  const [list, setList] = useState(() => { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch (e) { return []; } });
  const [form, setForm] = useState({ nome: "", matricula: "", senha: "" });
  const [errs, setErrs] = useState({});
  const [q, setQ] = useState("");
  const [toast, setToast] = useState(null);
  const [summary, setSummary] = useState(null);
  const [drag, setDrag] = useState(false);
  const fileRef = useRef(null);

  useEffect(() => { try { localStorage.setItem(STORE, JSON.stringify(list)); } catch (e) {} }, [list]);
  const notify = useCallback((msg, type = "ok") => { setToast({ msg, type }); clearTimeout(window.__t); window.__t = setTimeout(() => setToast(null), 3500); }, []);

  const validate = (r) => {
    const e = {};
    if (!r.nome.trim()) e.nome = "Informe o nome completo";
    if (!r.matricula.trim()) e.matricula = "Informe a matrícula";
    else if (r.matricula.trim().length > 6) e.matricula = "A matrícula deve ter no máximo 6 dígitos";
    else if (!ASCII.test(r.matricula.trim())) e.matricula = "Use apenas caracteres ASCII (sem acentos)";
    if (!r.senha.trim()) e.senha = "Informe a senha";
    else if (!ASCII.test(r.senha.trim())) e.senha = "Use apenas caracteres ASCII (sem acentos)";
    return e;
  };

  const add = (ev) => {
    ev.preventDefault();
    const e = validate(form); setErrs(e);
    if (Object.keys(e).length) return notify("Corrija os campos destacados", "err");
    setList((l) => [...l, { id: uid(), nome: form.nome.trim(), matricula: form.matricula.trim(), senha: form.senha.trim() }]);
    setForm({ nome: "", matricula: "", senha: "" });
    notify("Registro adicionado à lista");
  };

  const handleFile = (file) => {
    if (!file) return;
    if (!/\.csv$/i.test(file.name)) return notify("Selecione um arquivo .csv", "err");
    Papa.parse(file, {
      header: true, skipEmptyLines: true, transformHeader: norm,
      complete: (res) => {
        const f = res.meta.fields || [];
        if (!["nome", "matricula", "senha"].every((c) => f.includes(c))) {
          setSummary({ ok: 0, bad: 0, missing: true });
          return notify("O CSV precisa das colunas nome, matricula e senha", "err");
        }
        const good = []; let bad = 0;
        res.data.forEach((r) => {
          const rec = { nome: String(r.nome || "").trim(), matricula: String(r.matricula || "").trim(), senha: String(r.senha || "").trim() };
          if (Object.keys(validate(rec)).length) bad++; else good.push({ id: uid(), ...rec });
        });
        setList((l) => [...l, ...good]);
        setSummary({ ok: good.length, bad });
        notify(`${good.length} registros importados com sucesso`, good.length ? "ok" : "err");
      },
      error: () => notify("Erro ao ler o arquivo", "err"),
    });
  };

  const downloadTemplate = () => {
    const csv = "\uFEFFnome,matricula,senha\nMaria da Silva,100234,4821\nJoão Pereira,100235,7390\nAna Souza,100236,x9K2\n";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    a.download = "modelo-crachas.csv"; a.click(); URL.revokeObjectURL(a.href);
    notify("Modelo CSV baixado");
  };

  const filtered = useMemo(() => {
    const t = norm(q); if (!t) return list;
    return list.filter((p) => norm(p.nome).includes(t) || norm(p.matricula).includes(t));
  }, [list, q]);

  const pdfOne = (p) => { try { makePdf([p], `cracha-${p.matricula}.pdf`); notify("PDF gerado"); } catch (e) { notify("Erro ao gerar PDF", "err"); } };
  const pdfAll = () => {
    if (!filtered.length) return notify("Nenhum registro para exportar", "err");
    try { makePdf(filtered, "crachas.pdf"); notify(`PDF com ${filtered.length} crachás gerado`); } catch (e) { notify("Erro ao gerar PDF", "err"); }
  };
  const clearAll = () => { if (list.length && confirm("Remover todos os registros?")) { setList([]); notify("Lista limpa"); } };

  const inp = (k) => "w-full rounded-lg border px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#0098b8] " + (errs[k] ? "border-red-400" : "border-slate-300");
  const tabBtn = (id, label) => html`<button onClick=${() => setTab(id)} class=${"px-4 py-2 rounded-lg text-sm font-medium transition " + (tab === id ? "bg-[#006f8e] text-white shadow" : "bg-white text-slate-600 hover:bg-slate-100 border border-slate-200")}>${label}</button>`;

  return html`<div class="max-w-5xl mx-auto p-4 sm:p-6">
    <header class="mb-5">
      <div class="flex items-center gap-3 mb-1"><img src=${LOGO} alt="Amafil" class="h-10 rounded" /><h1 class="text-2xl font-bold text-[#005a73]">Gerador de Crachás</h1></div>
      <p class="text-sm text-slate-500">Cartões de acesso com códigos de barras Code 128 (matrícula e senha).</p>
    </header>

    <div class="flex gap-2 mb-5">
      ${tabBtn("entrada", "Entrada de Dados")}
      ${tabBtn("cartoes", `Cartões Gerados (${list.length})`)}
    </div>

    ${tab === "entrada" && html`<section class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm">
      <div class="inline-flex rounded-lg bg-slate-100 p-1 mb-5">
        ${["manual", "csv"].map((m) => html`<button key=${m} onClick=${() => setMode(m)} class=${"px-4 py-1.5 rounded-md text-sm font-medium " + (mode === m ? "bg-white shadow text-[#005a73]" : "text-slate-500")}>${m === "manual" ? "Cadastro Manual" : "Importar CSV"}</button>`)}
      </div>

      ${mode === "manual" ? html`<form onSubmit=${add} class="grid gap-4 sm:grid-cols-3" noValidate>
        <div class="sm:col-span-3">
          <label class="block text-sm font-medium mb-1">Nome Completo</label>
          <input class=${inp("nome")} value=${form.nome} onInput=${(e) => setForm({ ...form, nome: e.target.value })} placeholder="Ex.: Maria da Silva" />
          ${errs.nome && html`<p class="text-xs text-red-600 mt-1">${errs.nome}</p>`}
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Matrícula</label>
          <input maxLength=${6} class=${inp("matricula")} value=${form.matricula} onInput=${(e) => setForm({ ...form, matricula: e.target.value })} placeholder="Até 6 dígitos, ex.: 100234" />
          ${errs.matricula && html`<p class="text-xs text-red-600 mt-1">${errs.matricula}</p>`}
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Senha</label>
          <input class=${inp("senha")} value=${form.senha} onInput=${(e) => setForm({ ...form, senha: e.target.value })} placeholder="Ex.: 4821" />
          ${errs.senha && html`<p class="text-xs text-red-600 mt-1">${errs.senha}</p>`}
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-[#006f8e] hover:bg-[#005a73] text-white font-medium rounded-lg px-4 py-2 text-sm">Adicionar à Lista</button>
        </div>
      </form>` : html`<div>
        <div
          onDragOver=${(e) => { e.preventDefault(); setDrag(true); }}
          onDragLeave=${() => setDrag(false)}
          onDrop=${(e) => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
          onClick=${() => fileRef.current.click()}
          class=${"cursor-pointer rounded-xl border-2 border-dashed p-10 text-center transition " + (drag ? "border-[#0098b8] bg-[#e6f4f8]" : "border-slate-300 hover:border-[#0098b8]")}>
          <div class="text-3xl mb-2">📄</div>
          <p class="font-medium">Arraste o arquivo .csv aqui ou clique para selecionar</p>
          <p class="text-xs text-slate-500 mt-1">Colunas: nome, matricula, senha (maiúsculas/minúsculas e acentos não importam)</p>
          <input ref=${fileRef} type="file" accept=".csv,text/csv" class="hidden" onChange=${(e) => { handleFile(e.target.files[0]); e.target.value = ""; }} />
        </div>
        <div class="flex flex-wrap items-center gap-3 mt-4">
          <button onClick=${downloadTemplate} class="border border-slate-300 hover:bg-slate-50 rounded-lg px-4 py-2 text-sm font-medium">Baixar Modelo CSV</button>
          ${summary && html`<div class=${"text-sm rounded-lg px-3 py-2 " + (summary.missing ? "bg-red-50 text-red-700" : "bg-emerald-50 text-emerald-800")}>
            ${summary.missing ? "Colunas obrigatórias não encontradas." : `${summary.ok} registros importados com sucesso` + (summary.bad ? ` · ${summary.bad} linhas ignoradas (campos vazios, matrícula com mais de 6 dígitos ou caracteres inválidos)` : "")}
          </div>`}
        </div>
      </div>`}
    </section>`}

    ${tab === "cartoes" && html`<section>
      <div class="flex flex-wrap gap-3 items-center mb-4">
        <input value=${q} onInput=${(e) => setQ(e.target.value)} placeholder="Buscar por nome ou matrícula…" class="flex-1 min-w-[200px] rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-[#0098b8]" />
        <button onClick=${pdfAll} class="bg-[#006f8e] hover:bg-[#005a73] text-white font-medium rounded-lg px-4 py-2 text-sm">Gerar Todos em PDF</button>
        <button onClick=${clearAll} class="border border-slate-300 bg-white hover:bg-slate-50 rounded-lg px-4 py-2 text-sm">Limpar lista</button>
      </div>
      ${filtered.length === 0 ? html`<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-slate-500 text-sm">${list.length ? "Nenhum resultado para a busca." : "Nenhum cartão ainda. Adicione registros na aba Entrada de Dados."}</div>` : html`
      <div class="grid gap-4 sm:grid-cols-2">
        ${filtered.map((p) => html`<article key=${p.id} class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <div class="bg-[#006f8e] flex items-center justify-between px-3 py-2 border-b-4 border-[#0098b8]">
            <img src=${LOGO} alt="Amafil" class="h-9 rounded bg-white p-0.5" />
            <span class="text-white text-xs font-bold tracking-wide">CARTÃO DE ACESSO</span>
          </div>
          <h3 class="h-14 px-4 flex items-center justify-center text-center font-bold text-base text-[#005a73] leading-tight"><span class="line-clamp-2 break-words">${p.nome}</span></h3>
          <div class="px-4 space-y-3 h-[200px]"><${Bar} value=${p.matricula} label="Matrícula" /><${Bar} value=${p.senha} label="Senha" /></div>
          <div class="flex gap-2 mt-4 px-4 pb-4">
            <button onClick=${() => pdfOne(p)} class="flex-1 bg-slate-900 hover:bg-slate-700 text-white rounded-lg px-3 py-2 text-xs font-medium">Gerar PDF Individual</button>
            <button onClick=${() => { setList((l) => l.filter((x) => x.id !== p.id)); notify("Registro excluído"); }} class="border border-red-200 text-red-600 hover:bg-red-50 rounded-lg px-3 py-2 text-xs font-medium">Excluir</button>
          </div>
        </article>`)}
      </div>`}
      <p class="text-xs text-slate-500 mt-4">O PDF em lote usa grade de 2×4 cartões de tamanho fixo (90×62 mm) por página A4, sem cortar cartões na quebra de página.</p>
    </section>`}

    ${toast && html`<div class=${"fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-sm text-white shadow-lg " + (toast.type === "err" ? "bg-red-600" : "bg-emerald-600")}>${toast.msg}</div>`}
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
